name: GitHub Secrets Demo
on:
  push:
    branches:
      - main
jobs:
  secrets-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret availability
        env:
          MY_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$MY_TOKEN" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

